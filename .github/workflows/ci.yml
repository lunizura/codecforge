name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .

  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check C++20 compiler
        run: g++ --version
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -v

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codecforge"
version = "0.1.0"
description = "Autonomous, round-trip-verified binary format reverse-engineering synthesizer, code generator, and visual byte-map inspector"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0"]

[project.scripts]
codecforge = "codecforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
